<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Enterprise - Reset Password</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">JK Enterprise</a>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li class="logged-out-only"><a href="index.html">Home</a></li>
                <li class="logged-out-only"><a href="signin.html" class="auth-btn">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <h2>Reset Account Password</h2>
            <p class="form-subtitle">Request a security reset token to update your password.</p>

            <!-- Request Token Form -->
            <form id="requestResetForm">
                <div class="form-group">
                    <label for="resetEmail">Email Address *</label>
                    <input type="email" id="resetEmail" required placeholder="rethabileseshabela07@gmail.com">
                </div>
                <button type="submit" class="auth-submit-btn">Request Reset Token</button>
            </form>

            <hr style="margin: 2rem 0; border: none; border-top: 1px solid #edf2f7;">

            <!-- Submit New Password Form -->
            <form id="submitNewPasswordForm">
                <div class="form-group">
                    <label for="resetToken">Security Reset Token *</label>
                    <input type="text" id="resetToken" required placeholder="Paste reset token here">
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" required placeholder="Enter new password">
                </div>
                <button type="submit" class="auth-submit-btn">Update Password</button>
            </form>

            <p id="resetFeedback" class="form-feedback"></p>

            <p class="form-footer">
                <a href="signin.html" class="link-btn">&larr; Back to Sign In</a>
            </p>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <h4>JK Enterprise</h4>
                <p>123 Business Street, Suite 100</p>
                <p>Email: info@jkenterprise.com</p>
                <p>Phone: (123) 456-7890</p>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2026 JK Enterprise. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://jk-enterprise-xqtu.onrender.com/api';
        const requestForm = document.getElementById('requestResetForm');
        const submitForm = document.getElementById('submitNewPasswordForm');
        const feedback = document.getElementById('resetFeedback');

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Generating security token...';
            feedback.className = 'form-feedback';

            const email = document.getElementById('resetEmail').value;

            try {
                const res = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    feedback.textContent = 'Reset token generated! Auto-filling field below...';
                    feedback.className = 'form-feedback success';
                    if (data.resetToken) {
                        document.getElementById('resetToken').value = data.resetToken;
                    }
                } else {
                    feedback.textContent = data.error || 'Failed to generate token.';
                    feedback.className = 'form-feedback error';
                }
            } catch (err) {
                feedback.textContent = 'Unable to connect to live server.';
                feedback.className = 'form-feedback error';
            }
        });

        submitForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Updating password...';
            feedback.className = 'form-feedback';

            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    feedback.textContent = data.message;
                    feedback.className = 'form-feedback success';
                    setTimeout(() => window.location.href = 'signin.html', 2000);
                } else {
                    feedback.textContent = data.error || 'Failed to reset password.';
                    feedback.className = 'form-feedback error';
                }
            } catch (err) {
                feedback.textContent = 'Unable to connect to live server.';
                feedback.className = 'form-feedback error';
            }
        });
    </script>
</body>
</html>
