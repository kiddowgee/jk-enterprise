<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Enterprise - Reset Password</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">JK Enterprise</a></div>
        </nav>
    </header>

    <main class="auth-container" style="max-width: 450px; margin: 4rem auto; padding: 2rem;">
        <h2>Reset Account Password</h2>
        
        <!-- Step 1: Request Reset Token -->
        <form id="requestResetForm" style="margin-bottom: 2rem;">
            <p>Enter your registered email address to receive a security reset token.</p>
            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" required placeholder="user@example.com">
            </div>
            <button type="submit" class="auth-submit-btn">Request Reset Token</button>
        </form>

        <!-- Step 2: Submit Token & New Password -->
        <form id="submitNewPasswordForm">
            <div class="form-group">
                <label for="resetToken">Security Reset Token</label>
                <input type="text" id="resetToken" required placeholder="Paste reset token here">
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required placeholder="Enter new password">
            </div>
            <button type="submit" class="auth-submit-btn">Update Password</button>
        </form>

        <p id="resetFeedback" class="form-feedback" style="margin-top: 1rem;"></p>
        <p style="margin-top: 1.5rem;"><a href="signin.html">&larr; Back to Sign In</a></p>
    </main>

    <script>
        const API_URL = 'https://jk-enterprise-xqtu.onrender.com/api';
        const requestForm = document.getElementById('requestResetForm');
        const submitForm = document.getElementById('submitNewPasswordForm');
        const feedback = document.getElementById('resetFeedback');

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Generating token...';
            feedback.className = 'form-feedback';

            const email = document.getElementById('resetEmail').value;

            try {
                const res = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    feedback.textContent = data.message;
                    feedback.className = 'form-feedback success';
                    if (data.resetToken) {
                        document.getElementById('resetToken').value = data.resetToken;
                    }
                } else {
                    feedback.textContent = data.error || 'Request failed.';
                    feedback.className = 'form-feedback error';
                }
            } catch (err) {
                feedback.textContent = 'Unable to connect to server.';
                feedback.className = 'form-feedback error';
            }
        });

        submitForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.textContent = 'Updating password...';
            feedback.className = 'form-feedback';

            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    feedback.textContent = data.message;
                    feedback.className = 'form-feedback success';
                    setTimeout(() => window.location.href = 'signin.html', 2000);
                } else {
                    feedback.textContent = data.error || 'Failed to update password.';
                    feedback.className = 'form-feedback error';
                }
            } catch (err) {
                feedback.textContent = 'Unable to connect to server.';
                feedback.className = 'form-feedback error';
            }
        });
    </script>
</body>
</html>
